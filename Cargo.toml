[package]
name = "tastyworks"
version = "0.31.0"
description = "Unofficial Tastyworks API"
authors = ["Tobias Mansfield-Williams <contact@tmwhere.com>"]
repository = "https://github.com/thetatool/tastyworks-rs"
license = "MIT"
edition = "2024"
rust-version = "1.85"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
futures = "0.3"
itertools = "0.14"
log = "0.4"
num-rational = "0.3"
num-traits = { version = "0.2", default-features = false }
options-common = "0.8"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "url"] }
url = "2"

[dev-dependencies]
rpassword = "7"
tokio = { version = "1", features = ["full"] }

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls", "tungstenite/native-tls"]
rustls-tls = ["reqwest/rustls", "tungstenite/rustls-tls-native-roots"]
